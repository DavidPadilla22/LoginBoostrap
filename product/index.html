<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Login Básico con Bootstrap</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <div class="container">
    <div class="row justify-content-center mt-5">
      <div class="col-md-4">
        <h2 class="text-center mb-4">Iniciar Sesión</h2>

        <form action="#" method="post">
          <div class="mb-3">
            <label for="username" class="form-label">Usuario</label>
            <input type="text" class="form-control" id="username" name="username" required>
          </div>

          <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="rememberUser" name="rememberUser">
            <label class="form-check-label" for="rememberUser">
              Recordar usuario
            </label>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Contraseña</label>
            <input type="password" class="form-control" id="password" name="password" required>
          </div>
          
          <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="rememberUser" name="rememberUser">
            <label class="form-check-label" for="rememberUser">
              Recordar Contraseña
            </label>
          </div>

          
          <div class="d-grid mb-3">
            <a href="html/paginaprincipal.html" class="btn btn-primary">Entrar</a>
          </div>
        </form>



        <div class="text-center">
          <a href="html/formularioregistro.html">Registrarse</a> | 
          <a href="html/recuperarcontraseña.html">¿Olvidaste tu contraseña?</a> | 
          <a href="html/recuperarusuario.html">¿Olvidaste tu usuario?</a>

        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/aprender.js"></script>
</body>
</html>
