<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Iniciar Sesión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #e6f4ea; }
    .card { margin-top: 100px; border-radius: 12px; }
    h2 { color: #2e7d32; }
    .btn-primary { background-color: #4caf50; border: none; }
    .btn-primary:hover { background-color: #388e3c; }
    .registro-link {
      color: #0d6efd;
      text-decoration: none;
      font-weight: 500;
    }
    .registro-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card shadow mx-auto" style="max-width: 360px;">
      <div class="card-body">
        <h2 class="text-center mb-4">Iniciar Sesión</h2>

        <form onsubmit="return login()">
          <input type="text" id="user" class="form-control mb-3" placeholder="Usuario" required>
          <input type="password" id="pass" class="form-control mb-3" placeholder="Contraseña" required>
          <button type="submit" class="btn btn-primary w-100 mb-2">Entrar</button>
        </form>

        <div class="text-center mt-3">
          <span>¿No tienes cuenta? </span>
          <a href="formulario.html" class="registro-link">Registrarse</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    function login() {
      const user = document.getElementById('user').value;
      const pass = document.getElementById('pass').value;

      if (user === "admin" && pass === "1234") {
        window.location.href = "formulario.html";
      } else {
        alert("Usuario o contraseña incorrectos. Si no tienes cuenta, haz clic en Registrarse.");
      }
      return false;
    }
  </script>
</body>
</html>
