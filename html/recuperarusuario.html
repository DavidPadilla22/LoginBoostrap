<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Recuperar Usuario</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center vh-100 bg-light">

  <div class="card shadow p-4" style="width: 22rem;">
    <h4 class="text-center">¿Olvidaste tu usuario?</h4>
    <p class="text-muted text-center">Ingresa tu correo y te enviaremos tu usuario</p>

    <form id="form-recuperar-usuario">
      <div class="mb-3">
        <label for="correo" class="form-label">Correo electrónico</label>
        <input type="email" class="form-control" id="correo" required>
      </div>

      <div class="d-grid">
        <button type="submit" class="btn btn-primary">Enviar</button>
      </div>
    </form>

    <div class="text-center mt-3">
      <a href="../index.html">Volver al Inicio de sesion</a>
    </div>
  </div>

  <script src="../js/aprender.js"></script>
</body>
</html>
